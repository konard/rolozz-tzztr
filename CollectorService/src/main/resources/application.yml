# Настройки встроенного сервера Tomcat
server:
  port: 8082  # Порт, на котором будет запущено приложение

# Основные настройки Spring Framework
spring:
  application:
   name: CollectorService  # Имя микросервиса для регистрации в сервис-дискавери

  # Настройки шифрования (кастомная конфигурация)
  encryption:
    secret-key: 1234567890123456  # Секретный ключ для шифрования данных (16 байт для AES-128)

  # Настройки виртуальных потоков (Project Loom / Java 21+)
  threads:
    virtual:
      enabled: true  # Включение виртуальных потоков для улучшения производительности I/O операций

  # Настройки источника данных (база данных)
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres  # JDBC URL для подключения к PostgreSQL
    username: root  # Имя пользователя базы данных
    password: root  # Пароль пользователя базы данных
    driver-class-name: org.postgresql.Driver  # JDBC драйвер PostgreSQL
    hikari:  # Настройки пула соединений HikariCP
      maximum-pool-size: 5  # Максимальное количество соединений в пуле
      minimum-idle: 1  # Минимальное количество простаивающих соединений
      connection-timeout: 3000  # Таймаут получения соединения из пула (в миллисекундах)
      idle-timeout: 600000  # Время простоя соединения перед закрытием (10 минут)
      max-lifetime: 1800000  # Максимальное время жизни соединения (30 минут)

  # Настройки JPA (Java Persistence API) и Hibernate
  jpa:
    hibernate:
      ddl-auto: none  # Стратегия управления схемой БД: none - без автоматических изменений
    show-sql: true  # Вывод SQL-запросов в консоль
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Диалект SQL для PostgreSQL
        format_sql: true  # Форматирование SQL-запросов для лучшей читаемости

  # Настройки Liquibase - инструмента миграции базы данных
  liquibase:
    enabled: true  # Включение Liquibase
    change-log: classpath:/db/changelog/db.changelog-master.yaml  # Путь к главному файлу миграций
    drop-first: false  # Не удалять схему перед применением миграций


# Настройки SpringDoc OpenAPI для документации API
springdoc:
  api-docs:
    path: /api-docs  # Путь к JSON документации OpenAPI
  swagger-ui:
    path: /swagger-ui.html  # Путь к веб-интерфейсу Swagger UI
    operations-sorter: method  # Сортировка методов по HTTP методу (GET, POST и т.д.)
    tags-sorter: alpha  # Сортировка тегов по алфавиту

# Кастомные настройки для интеграции с Wildberries API
wb:
  api:
    content:
      base-url: https://content-api.wildberries.ru  # Базовый URL API контента Wildberries
      cards-path: /content/v2/get/cards/list  # Путь к эндпоинту получения карточек товаров
      max-page-size: 100  # Максимальный размер страницы при пагинации
      connect-timeout: 5s  # Таймаут соединения (5 секунд)
      read-timeout: 10s  # Таймаут чтения данных (10 секунд)

# Настройки Resilience4j - библиотеки для реализации паттернов отказоустойчивости
resilience4j:
  circuitbreaker:  # Circuit Breaker - предохранитель для разрыва цепи при ошибках
    instances:
      wbApiCircuitBreaker:  # Имя экземпляра предохранителя для WB API
        sliding-window-size: 10  # Размер скользящего окна для статистики вызовов
        failure-rate-threshold: 50  # Порог процентного отношения неудачных вызовов для открытия цепи (50%)
        wait-duration-in-open-state: 60s  # Время ожидания в открытом состоянии (60 секунд)
        permitted-number-of-calls-in-half-open-state: 3  # Разрешенное количество вызовов в полуоткрытом состоянии
        automatic-transition-from-open-to-half-open-enabled: true  # Автоматический переход в полуоткрытое состояние
        slow-call-rate-threshold: 50  # Порог медленных вызовов для открытия цепи (50%)
        slow-call-duration-threshold: 10s  # Порог длительности медленного вызова (10 секунд)
  retry:  # Retry - механизм повторных попыток
    instances:
      wbApiRetry:  # Имя экземпляра ретраера для WB API
        max-attempts: 3  # Максимальное количество попыток выполнения запроса
        wait-duration: 1s  # Время ожидания между попытками (1 секунда)
        exponential-backoff-multiplier: 2.0  # Множитель для экспоненциальной задержки
      keycloakRetry:  # Повторные попытки обращения к Keycloak (создание, обновление, удаление пользователей)
        max-attempts: 3  # Максимальное количество попыток обращения к Keycloak
        wait-duration: 500ms  # Время ожидания между попытками
        exponential-backoff-multiplier: 2.0  # Множитель для экспоненциальной задержки
        retry-exceptions:  # Повторяем только временные сбои: недоступность Keycloak
          - com.cor.collectorservice.util.exception.KeycloakUnavailableException

  bulkhead:  # Bulkhead - ограничение количества одновременных вызовов
    instances:
      wbApiBulkhead:  # Имя экземпляра булхеда для WB API
        max-concurrent-calls: 5  # Максимальное количество одновременных вызовов
        max-wait-duration: 500ms  # Максимальное время ожидания в очереди (500 миллисекунд)
  timelimiter:  # Time Limiter - ограничение времени выполнения
    instances:
      wbApiTimeLimiter:  # Имя экземпляра лимитера времени для WB API
        timeout-duration: 10s  # Максимальное время выполнения (10 секунд)

# Настройки интеграции с Keycloak: аутентификация и управление учётными записями
keycloak:
  realm: my-realm  # Realm, в котором заведены пользователи сервиса
  auth-server-url: http://localhost:8095  # Базовый URL Keycloak без завершающего слэша
  client-id: authservice-client  # Конфиденциальный клиент, от имени которого выполняется вход
  client-secret: 'm#5Fhj2$8xLp9!qB6*KvE@W7nGd4%zR1'  # Секрет клиента (кавычки обязательны из-за спецсимволов)
  default-role: USER  # Realm-роль, назначаемая пользователю сразу после регистрации
  admin:  # Сервисная учётная запись для Admin REST API
    username: admin  # Логин администратора Keycloak
    password: admin  # Пароль администратора Keycloak
    client-id: admin-cli  # Клиент административного доступа
    realm: master  # Realm, в котором заведён администратор
    connection-pool-size: 10  # Размер пула HTTP-соединений административного клиента
  registration:  # Настройки саги регистрации
    compensation:  # Откат записи в Keycloak, если профиль не сохранился в БД
      max-attempts: 10  # Максимальное число фоновых попыток удаления «осиротевшей» учётной записи
      retry-interval: PT30S  # Интервал между запусками фонового обработчика очереди (формат ISO-8601)
  jwt:  # Проверка входящих access-токенов
    required-role: USER  # Роль по умолчанию для аннотации @RequiresRole
    clock-skew: PT30S  # Допустимое расхождение часов с Keycloak при проверке exp/nbf
    public-paths:  # Пути, доступные без токена (Ant-шаблоны)
      - /api/auth/**
      - /api-docs/**
      - /api-docs
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/**
      - /error

# Настройки логирования
logging:
  level:
    liquibase: DEBUG  # Уровень логирования для Liquibase
    org.springframework.jdbc.core: DEBUG  # Уровень логирования для JDBC Spring
    org.hibernate.SQL: DEBUG  # Уровень логирования для SQL запросов Hibernate
    root: debug  # Корневой уровень логирования