server:
  port: 8082

spring:
  application:
    name: CollectorService

  encryption:
    secret-key: 1234567890123456

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://db:5432/postgres
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    drop-first: false


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

wb:
  api:
    content:
      base-url: https://content-api.wildberries.ru
      cards-path: /content/v2/get/cards/list
      max-page-size: 100
      connect-timeout: 5s
      read-timeout: 10s

resilience4j:
  circuitbreaker:
    instances:
      wbApiCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 10s
  retry:
    instances:
      wbApiRetry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2.0
      keycloakRetry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - com.cor.collectorservice.util.exception.KeycloakUnavailableException

  bulkhead:
    instances:
      wbApiBulkhead:
        max-concurrent-calls: 5
        max-wait-duration: 500ms
  timelimiter:
    instances:
      wbApiTimeLimiter:
        timeout-duration: 10s

keycloak:
  realm: my-realm
  # Внутри docker-сети Keycloak доступен по имени сервиса и внутреннему порту 8080
  auth-server-url: http://keycloak:8080
  client-id: authservice-client
  client-secret: 'm#5Fhj2$8xLp9!qB6*KvE@W7nGd4%zR1'
  default-role: USER
  admin:
    username: admin
    password: admin
    client-id: admin-cli
    realm: master
    connection-pool-size: 10
  registration:
    compensation:
      max-attempts: 10
      retry-interval: PT30S
  jwt:
    required-role: USER
    clock-skew: PT30S
    # Keycloak запущен с KC_HOSTNAME=localhost, поэтому в выпускаемых токенах издатель
    # отличается от внутреннего адреса обращения. Значение должно совпадать с claim `iss`
    # выданного токена — при смене KC_HOSTNAME его нужно поправить.
    issuer-uri: http://localhost:8080/realms/my-realm
    public-paths:
      - /api/auth/**
      - /api-docs/**
      - /api-docs
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/**
      - /error

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    liquibase: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.vault: DEBUG
    root: debug