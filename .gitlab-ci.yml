stages:
  - build
  - test
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: 1

build-job:
  stage: build
  script:
    - echo "[BUILD] Проверка сборки фронтенда"
    - cd frontend
    - npm ci
    - npm run build
  only:
    changes:
      - frontend/**/*

unit-test-job:
  stage: test
  script:
    - echo "[TEST] Unit tests"
    - sleep 3
  only:
    changes:
      - frontend/**/*

lint-test-job:
  stage: test
  script:
    - echo "[LINT] Linting"
    - sleep 2
  only:
    changes:
      - frontend/**/*

deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "[DEPLOY] Запуск деплоя"
    - chmod +x ./run.sh

    # Сохраняем предыдущий образ
    - docker tag wb-frontend:latest wb-frontend:previous || true

    # Деплой
    - ./run.sh deploy-frontend

    # Healthcheck
    - echo "[HEALTHCHECK] Проверка доступности сервиса"
    - sleep 5
    - curl -f http://localhost:3000 || (echo "[ERROR] Healthcheck failed" && ./run.sh rollback && exit 1)

    - echo "[DEPLOY] Успешно"
  only:
    changes:
      - frontend/**/*
  when: on_success
